name: Bootstrap wrapper on feature branch

on:
  push:
    branches: [feature/gradle-quality]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Generate official Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.0 --distribution-type bin
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradlew
          test -s gradlew.bat
      - name: Commit generated wrapper if missing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Generate official Gradle 9.3 wrapper"
            git push origin HEAD:refs/heads/feature/gradle-quality
          else
            echo "Gradle wrapper already present."
          fi
