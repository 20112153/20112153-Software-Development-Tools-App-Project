name: Kotlin Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify structure, build and run automated tests
        run: ./gradlew --no-daemon clean check jacocoTestReport
      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: ignore
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/test-results/test/
          if-no-files-found: ignore

      # GitHub checkout is the source of truth; package ONLY after all checks pass.
      - name: Validate release helper script
        if: success()
        run: bash -n scripts/publish-releases.sh
      - name: Package source directly from the checked-out GitHub commit
        if: success()
        run: |
          mkdir -p build/submission
          git archive --format=zip --prefix=gym-class-manager/ \
            --output=build/submission/gym-class-manager-source.zip HEAD
          unzip -t build/submission/gym-class-manager-source.zip > /dev/null
          (cd build/submission && sha256sum gym-class-manager-source.zip > SHA256SUMS.txt)
          git rev-parse HEAD > build/submission/SOURCE_COMMIT.txt
      - name: Upload GitHub source ZIP and verification details
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: github-source-zip
          path: build/submission/
          if-no-files-found: error
          retention-days: 90
