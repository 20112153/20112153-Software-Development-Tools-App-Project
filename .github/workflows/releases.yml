name: Publish milestone Git tags

# Only tag tested code: this follows a successful main-branch CI build.
on:
  workflow_run:
    workflows: ["Kotlin Build and Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Create and push annotated tags (idempotent)
        env:
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force
          tag_if_missing() {
            local tag="$1"
            local sha="$2"
            local message="$3"
            if git rev-parse --verify -q "refs/tags/$tag" >/dev/null; then
              echo "$tag exists already"
            else
              git tag -a "$tag" "$sha" -m "$message"
              git push origin "refs/tags/$tag"
            fi
          }
          tag_if_missing "v0.1.0" "2501ca0d95256041da4cf7e4e6b2c09b38034760" "Starter framework, issue #1, PR #2"
          tag_if_missing "v0.2.0" "77d3351b3efd7a57c601153ed7f41d15d9ff0991" "Menus, booking CRUD and JSON; issues #3, #5, #7"
          tag_if_missing "v0.3.0" "9a2cdacc3869fabcec6911480ad2aaeb28110c77" "Search, filtering and reporting; issue #9"
          tag_if_missing "v0.4.0" "098c4b06639876b723b73a256aee4d9cda9afce5" "Gradle wrapper, JUnit and coverage; issue #11"
          tag_if_missing "v1.0.0" "$MAIN_SHA" "Final documented project and QA; issues #13 and #15"
